<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="description"
            content="MatrixIntervals is a music theory practice game designed to help musicians become faster and more confident at calculating musical intervals."
    >

    <title>MatrixIntervals</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >
</head>

<body>

<div class="matrix-background">
    <div
            class="matrix"
            id="interval-matrix"
    ></div>
</div>

<main>

    <section class="hero">

        <div class="hero-content">

            <p class="hero-brand">
                MatrixIntervals
            </p>

            <h1>
                Master Musical Intervals.
                <span>One Matrix at a Time.</span>
            </h1>

            <p class="hero-description">
                A music theory practice game designed to help
                musicians become faster and more confident
                at calculating musical intervals.
            </p>

            <div class="hero-actions">

                <a
                        class="button button-primary"
                        href="#download"
                >
                    Download MatrixIntervals
                </a>

            </div>

        </div>

        <div class="hero-screenshot">

            <div class="screenshot-frame">

                <img
                        src="images/hero.jpg"
                        alt="MatrixIntervals application"
                >

            </div>

        </div>

    </section>

    <section id="download" class="download-section">

    </section>

</main>

<script src="js/main.js"></script>

</body>
</html>
